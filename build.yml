name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Android project banao
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/battle/lite
          cp index.html app/src/main/assets/index.html
          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositories { google(); mavenCentral() }
          }
          rootProject.name = 'BattleLite'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.battle.lite'
            compileSdk 34
            defaultConfig {
              applicationId 'com.battle.lite'
              minSdk 24
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Battle Lite" android:icon="@android:drawable/ic_menu_compass">
              <activity android:name=".MainActivity" android:exported="true"
                android:screenOrientation="landscape"
                android:configChanges="orientation|screenSize|keyboardHidden"
                android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/battle/lite/MainActivity.java <<'EOF'
          package com.battle.lite;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebView;
          public class MainActivity extends Activity {
            WebView w;
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              w = new WebView(this);
              w.getSettings().setJavaScriptEnabled(true);
              w.setBackgroundColor(0xFF111111);
              w.loadUrl("file:///android_asset/index.html");
              setContentView(w);
            }
            @Override public void onWindowFocusChanged(boolean f) {
              super.onWindowFocusChanged(f);
              if (f) getWindow().getDecorView().setSystemUiVisibility(
                View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
            }
          }
          EOF
      - name: APK build karo
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BattleLite-APK
          path: app/build/outputs/apk/debug/app-debug.apk
