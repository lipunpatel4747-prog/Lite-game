
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Battle Lite 120 Levels</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;touch-action:none}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');
let W,H;
function rs(){W=c.width=innerWidth;H=c.height=innerHeight}
rs();addEventListener('resize',rs);

const M=2400,R=(a,b)=>a+Math.random()*(b-a);
let E=[],B=[],I=[],P,Z,over=0,kills=0,joy={},t0=0;
let level=1,screen='menu';
let unlocked=Math.max(1,Math.min(120,Number(localStorage.getItem('battleUnlocked'))||1));

function bots(){return Math.min(60,14+Math.floor((level-1)*.4))}
function enemySpeed(){return 120+Math.min(100,level*.8)}
function enemyHP(){return 60+Math.floor(level/15)*5}

function mk(p){
 return {
  x:R(200,M-200),y:R(200,M-200),
  hp:p?100:enemyHP(),
  ammo:p?40:999,cd:0,a:0,p,
  col:p?'#4af':'#f55'
 };
}

function init(l){
 level=l;
 E=[];B=[];I=[];joy={};
 P=mk(true);E.push(P);

 for(let i=0;i<bots();i++)E.push(mk(false));

 for(let i=0;i<50;i++)
 I.push({x:R(50,M-50),y:R(50,M-50),t:i%2});

 Z={x:M/2,y:M/2,r:1700};
 over=0;kills=0;
 t0=performance.now();
 screen='game';
}

function sh(e,a){
 if(e.cd>0)return;
 e.cd=e.p?.18:.7;
 if(e.p)e.ammo--;
 if(!e.p)a+=R(-.2,.2);
 B.push({
  x:e.x+Math.cos(a)*18,y:e.y+Math.sin(a)*18,
  vx:Math.cos(a)*700,vy:Math.sin(a)*700,
  o:e,l:.8
 });
}

function up(d){
 if(screen!=='game'||over)return;

 const m=joy.m,f=joy.f;

 if(m){
  let dx=m.x-m.x0,dy=m.y-m.y0,l=Math.hypot(dx,dy);
  if(l>8){
   let k=Math.min(l,60)/60;
   P.x+=dx/l*k*230*d;
   P.y+=dy/l*k*230*d;
  }
 }

 if(f){
  let dx=f.x-f.x0,dy=f.y-f.y0;
  if(Math.hypot(dx,dy)>10){
   P.a=Math.atan2(dy,dx);
   if(P.ammo>0)sh(P,P.a);
  }
 }

 for(const e of E){
  e.cd-=d;
  if(e.p)continue;

  let n=null,nd=450;

  for(const o of E){
   if(o===e)continue;
   let q=Math.hypot(o.x-e.x,o.y-e.y);
   if(q<nd){nd=q;n=o}
  }

  let gx=null,gy=null,sp=enemySpeed();

  if(Math.hypot(e.x-Z.x,e.y-Z.y)>Z.r-80){
   gx=Z.x;gy=Z.y;sp+=20;
  }else if(n){
   e.a=Math.atan2(n.y-e.y,n.x-e.x);
   sh(e,e.a);
   if(nd>220){gx=n.x;gy=n.y}
  }else{
   if(!e.w||Math.hypot(e.w.x-e.x,e.w.y-e.y)<30)
   e.w={x:R(100,M-100),y:R(100,M-100)};
   gx=e.w.x;gy=e.w.y;
  }

  if(gx!==null){
   let a=Math.atan2(gy-e.y,gx-e.x);
   e.x+=Math.cos(a)*sp*d;
   e.y+=Math.sin(a)*sp*d;
   if(!n)e.a=a;
  }
 }

 Z.r=Math.max(120,1700-(performance.now()-t0)/1000*(10+level*.15));

 for(const e of E){
  e.x=Math.max(10,Math.min(M-10,e.x));
  e.y=Math.max(10,Math.min(M-10,e.y));
  if(Math.hypot(e.x-Z.x,e.y-Z.y)>Z.r)e.hp-=6*d;
 }

 for(let i=B.length-1;i>=0;i--){
  const b=B[i];
  b.x+=b.vx*d;b.y+=b.vy*d;b.l-=d;
  let hit=b.l<=0;

  if(!hit){
   for(const e of E){
    if(e!==b.o&&Math.hypot(e.x-b.x,e.y-b.y)<16){
     e.hp-=b.o.p?18:10+Math.floor(level/25);
     hit=true;
     if(e.hp<=0&&b.o.p)kills++;
     break;
    }
   }
  }
  if(hit)B.splice(i,1);
 }

 for(let i=I.length-1;i>=0;i--){
  const k=I[i];
  if(Math.hypot(k.x-P.x,k.y-P.y)<26){
   if(k.t)P.ammo+=25;
   else P.hp=Math.min(100,P.hp+30);
   I.splice(i,1);
  }
 }

 E=E.filter(e=>e.hp>0);

 if(P.hp<=0){
  over=1;
 }else if(E.length===1){
  over=2;
  if(level<120){
   unlocked=Math.max(unlocked,level+1);
   localStorage.setItem('battleUnlocked',unlocked);
  }
 }
}

function stick(j){
 if(!j)return;
 g.strokeStyle='#fff6';g.lineWidth=3;
 g.beginPath();g.arc(j.x0,j.y0,60,0,7);g.stroke();
 let dx=j.x-j.x0,dy=j.y-j.y0,l=Math.hypot(dx,dy),k=l>60?60/l:1;
 g.fillStyle='#fff6';
 g.beginPath();g.arc(j.x0+dx*k,j.y0+dy*k,26,0,7);g.fill();
}

function dr(){
 g.fillStyle='#111';g.fillRect(0,0,W,H);

 if(screen==='menu'){
  g.textAlign='center';
  g.fillStyle='#fff';g.font='bold 28px sans-serif';
  g.fillText('BATTLE LITE',W/2,35);
  g.font='14px sans-serif';
  g.fillText('LEVEL SELECT  |  UNLOCKED: '+unlocked+'/120',W/2,57);

  let cols=10,gap=4;
  let cellW=(W-20)/cols;
  let cellH=Math.min(25,(H-90)/12);

  for(let i=1;i<=120;i++){
   let col=(i-1)%cols,row=Math.floor((i-1)/cols);
   let x=10+col*cellW,y=70+row*cellH;
   g.fillStyle=i<=unlocked?'#287b42':'#444';
   g.fillRect(x+2,y+2,cellW-4,cellH-4);
   g.fillStyle=i<=unlocked?'#fff':'#999';
   g.font='bold 12px sans-serif';
   g.fillText(i<=unlocked?i:'🔒',x+cellW/2,y+cellH/2+4);
  }

  g.fillStyle='#aaa';g.font='12px sans-serif';
  g.fillText('Tap unlocked level to play',W/2,H-8);
  return;
 }

 g.save();
 g.translate(W/2-P.x,H/2-P.y);

 g.fillStyle='#2d5a2d';g.fillRect(0,0,M,M);
 g.strokeStyle='#ffffff14';g.lineWidth=1;g.beginPath();

 for(let i=0;i<=M;i+=200){
  g.moveTo(i,0);g.lineTo(i,M);
  g.moveTo(0,i);g.lineTo(M,i);
 }
 g.stroke();

 for(const k of I){
  g.fillStyle=k.t?'#fd3':'#3f6';
  g.fillRect(k.x-8,k.y-8,16,16);
 }

 for(const e of E){
  g.fillStyle=e.col;g.beginPath();
  g.arc(e.x,e.y,16,0,7);g.fill();

  g.strokeStyle='#000';g.lineWidth=5;
  g.beginPath();g.moveTo(e.x,e.y);
  g.lineTo(e.x+Math.cos(e.a)*26,e.y+Math.sin(e.a)*26);
  g.stroke();

  if(!e.p){
   g.fillStyle='#0008';g.fillRect(e.x-16,e.y-26,32,4);
   g.fillStyle='#f33';
   g.fillRect(e.x-16,e.y-26,32*Math.max(0,e.hp/enemyHP()),4);
  }
 }

 g.fillStyle='#ff0';
 for(const b of B)g.fillRect(b.x-3,b.y-3,6,6);

 g.fillStyle='rgba(255,0,0,.28)';
 g.beginPath();g.rect(-1000,-1000,M+2000,M+2000);
 g.moveTo(Z.x+Z.r,Z.y);
 g.arc(Z.x,Z.y,Z.r,0,7);
 g.fill('evenodd');

 g.restore();

 g.fillStyle='#fff';g.font='bold 17px sans-serif';
 g.textAlign='left';
 g.fillText('LEVEL '+level+'  |  Alive: '+E.length+'  |  Kill: '+kills,12,25);

 g.fillStyle='#0008';g.fillRect(12,38,150,12);
 g.fillStyle='#3f6';
 g.fillRect(12,38,150*Math.max(0,P.hp)/100,12);

 g.fillStyle='#fd3';
 g.fillText('Ammo: '+P.ammo,12,72);

 stick(joy.m);stick(joy.f);

 if(over){
  g.fillStyle='#000c';g.fillRect(0,0,W,H);
  g.fillStyle='#fff';g.textAlign='center';
  g.font='bold 34px sans-serif';
  g.fillText(over===2?(level===120?'CHAMPION! 🏆':'LEVEL COMPLETE!'):'GAME OVER',W/2,H/2-35);

  g.font='18px sans-serif';
  g.fillText('Level '+level+'  |  Kills: '+kills,W/2,H/2+5);
  g.fillText(over===2?(level===120?'You completed all 120 levels!':'Next Level Unlocked!'):'Try Again!',W/2,H/2+35);
  g.fillText('TAP TO CONTINUE',W/2,H/2+75);
 }
}

c.addEventListener('pointerdown',e=>{
 if(screen==='menu'){
  let cellW=(W-20)/10,cellH=Math.min(25,(H-90)/12);
  let col=Math.floor((e.clientX-10)/cellW);
  let row=Math.floor((e.clientY-70)/cellH);
  let n=row*10+col+1;
  if(col>=0&&col<10&&row>=0&&row<12&&n<=unlocked)init(n);
  return;
 }

 if(over){
  if(over===2&&level<120)init(level+1);
  else {screen='menu';over=0;joy={}}
  return;
 }

 joy[e.clientX<W/2?'m':'f']={
  id:e.pointerId,x0:e.clientX,y0:e.clientY,
  x:e.clientX,y:e.clientY
 };
});

c.addEventListener('pointermove',e=>{
 for(const k in joy)
 if(joy[k].id===e.pointerId){
  joy[k].x=e.clientX;joy[k].y=e.clientY;
 }
});

const en=e=>{
 for(const k in joy)
 if(joy[k].id===e.pointerId)delete joy[k];
};
c.addEventListener('pointerup',en);
c.addEventListener('pointercancel',en);

let last=performance.now();
function loop(t){
 const d=Math.min(.05,(t-last)/1000);
 last=t;up(d);dr();
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
