<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Battle Lite</title>
<style>html,body{margin:0;height:100%;background:#111;overflow:hidden;touch-action:none}canvas{display:block}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d');let W,H;
function rs(){W=c.width=innerWidth;H=c.height=innerHeight}rs();addEventListener('resize',rs);
const M=2400,R=(a,b)=>a+Math.random()*(b-a);
let E,B,I,P,Z,over,joy,kills,t0;
function mk(p){return{x:R(200,M-200),y:R(200,M-200),hp:p?100:60,ammo:p?40:999,cd:0,a:0,p:p,col:p?'#4af':'#f55'}}
function init(){E=[];P=mk(true);E.push(P);for(let i=0;i<14;i++)E.push(mk(false));B=[];I=[];
 for(let i=0;i<50;i++)I.push({x:R(50,M-50),y:R(50,M-50),t:i%2});
 Z={x:M/2,y:M/2,r:1700};over=0;kills=0;joy={};t0=performance.now()}
function sh(e,a){if(e.cd>0)return;e.cd=e.p?0.18:0.7;if(e.p)e.ammo--;if(!e.p)a+=R(-.2,.2);
 B.push({x:e.x+Math.cos(a)*18,y:e.y+Math.sin(a)*18,vx:Math.cos(a)*700,vy:Math.sin(a)*700,o:e,l:.8})}
function up(d){
 if(over)return;
 const m=joy.m,f=joy.f;
 if(m){let dx=m.x-m.x0,dy=m.y-m.y0,l=Math.hypot(dx,dy);if(l>8){let k=Math.min(l,60)/60;P.x+=dx/l*k*230*d;P.y+=dy/l*k*230*d}}
 if(f){let dx=f.x-f.x0,dy=f.y-f.y0;if(Math.hypot(dx,dy)>10){P.a=Math.atan2(dy,dx);if(P.ammo>0)sh(P,P.a)}}
 for(const e of E){e.cd-=d;if(e.p)continue;
  let n=null,nd=450;
  for(const o of E){if(o===e)continue;let q=Math.hypot(o.x-e.x,o.y-e.y);if(q<nd){nd=q;n=o}}
  let gx=null,gy=null,sp=120;
  if(Math.hypot(e.x-Z.x,e.y-Z.y)>Z.r-80){gx=Z.x;gy=Z.y;sp=150}
  else if(n){e.a=Math.atan2(n.y-e.y,n.x-e.x);sh(e,e.a);if(nd>220){gx=n.x;gy=n.y}}
  else{if(!e.w||Math.hypot(e.w.x-e.x,e.w.y-e.y)<30)e.w={x:R(100,M-100),y:R(100,M-100)};gx=e.w.x;gy=e.w.y}
  if(gx!==null){let a=Math.atan2(gy-e.y,gx-e.x);e.x+=Math.cos(a)*sp*d;e.y+=Math.sin(a)*sp*d;if(!n)e.a=a}
 }
 Z.r=Math.max(120,1700-(performance.now()-t0)/1000*10);
 for(const e of E){e.x=Math.max(10,Math.min(M-10,e.x));e.y=Math.max(10,Math.min(M-10,e.y));
  if(Math.hypot(e.x-Z.x,e.y-Z.y)>Z.r)e.hp-=6*d}
 for(let i=B.length-1;i>=0;i--){const b=B[i];b.x+=b.vx*d;b.y+=b.vy*d;b.l-=d;let hit=b.l<=0;
  if(!hit)for(const e of E){if(e!==b.o&&Math.hypot(e.x-b.x,e.y-b.y)<16){e.hp-=b.o.p?18:10;hit=true;if(e.hp<=0&&b.o.p)kills++;break}}
  if(hit)B.splice(i,1)}
 for(let i=I.length-1;i>=0;i--){const k=I[i];if(Math.hypot(k.x-P.x,k.y-P.y)<26){if(k.t)P.ammo+=25;else P.hp=Math.min(100,P.hp+30);I.splice(i,1)}}
 E=E.filter(e=>e.hp>0);
 if(P.hp<=0)over=1;else if(E.length===1)over=2;
}
function stick(j){if(!j)return;g.strokeStyle='#fff6';g.lineWidth=3;g.beginPath();g.arc(j.x0,j.y0,60,0,7);g.stroke();
 let dx=j.x-j.x0,dy=j.y-j.y0,l=Math.hypot(dx,dy),k=l>60?60/l:1;
 g.fillStyle='#fff6';g.beginPath();g.arc(j.x0+dx*k,j.y0+dy*k,26,0,7);g.fill()}
function dr(){
 g.fillStyle='#111';g.fillRect(0,0,W,H);
 g.save();g.translate(W/2-P.x,H/2-P.y);
 g.fillStyle='#2d5a2d';g.fillRect(0,0,M,M);
 g.strokeStyle='#ffffff14';g.lineWidth=1;g.beginPath();
 for(let i=0;i<=M;i+=200){g.moveTo(i,0);g.lineTo(i,M);g.moveTo(0,i);g.lineTo(M,i)}g.stroke();
 for(const k of I){g.fillStyle=k.t?'#fd3':'#3f6';g.fillRect(k.x-8,k.y-8,16,16)}
 for(const e of E){g.fillStyle=e.col;g.beginPath();g.arc(e.x,e.y,16,0,7);g.fill();
  g.strokeStyle='#000';g.lineWidth=5;g.beginPath();g.moveTo(e.x,e.y);g.lineTo(e.x+Math.cos(e.a)*26,e.y+Math.sin(e.a)*26);g.stroke();
  if(!e.p){g.fillStyle='#0008';g.fillRect(e.x-16,e.y-26,32,4);g.fillStyle='#f33';g.fillRect(e.x-16,e.y-26,32*e.hp/60,4)}}
 g.fillStyle='#ff0';for(const b of B)g.fillRect(b.x-3,b.y-3,6,6);
 g.fillStyle='rgba(255,0,0,.28)';g.beginPath();g.rect(-1000,-1000,M+2000,M+2000);g.moveTo(Z.x+Z.r,Z.y);g.arc(Z.x,Z.y,Z.r,0,7);g.fill('evenodd');
 g.restore();
 g.fillStyle='#fff';g.font='bold 18px sans-serif';g.textAlign='left';
 g.fillText('Zinda: '+E.length+'   Kill: '+kills,14,28);
 g.fillStyle='#0008';g.fillRect(14,40,150,12);g.fillStyle='#3f6';g.fillRect(14,40,150*Math.max(0,P.hp)/100,12);
 g.fillStyle='#fd3';g.fillText('Goli: '+P.ammo,14,76);
 stick(joy.m);stick(joy.f);
 if(over){g.fillStyle='#000a';g.fillRect(0,0,W,H);g.fillStyle='#fff';g.textAlign='center';g.font='bold 40px sans-serif';
  g.fillText(over===2?'WINNER! 🏆':'GAME OVER',W/2,H/2-10);g.font='20px sans-serif';g.fillText('Kill: '+kills+'  |  Dobara khelne ke liye tap karo',W/2,H/2+30)}
}
c.addEventListener('pointerdown',e=>{if(over){init();return}
 joy[e.clientX<W/2?'m':'f']={id:e.pointerId,x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY}});
c.addEventListener('pointermove',e=>{for(const k in joy)if(joy[k].id===e.pointerId){joy[k].x=e.clientX;joy[k].y=e.clientY}});
const en=e=>{for(const k in joy)if(joy[k].id===e.pointerId)delete joy[k]};
c.addEventListener('pointerup',en);c.addEventListener('pointercancel',en);
init();let last=performance.now();
function loop(t){const d=Math.min(.05,(t-last)/1000);last=t;up(d);dr();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
